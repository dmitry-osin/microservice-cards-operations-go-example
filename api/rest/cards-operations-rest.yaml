openapi: 3.0.3
info:
  title: Title
  description: Title
  version: 1.0.0

components:
  schemas:
    CardOperations:
      type: object
      required: [ event-id, card-id, chain-id, amount, currency, status, transaction-date-time ]
      properties:
        event-id: { type: string, format: uuid }
        card-id: { type: string, format: uuid }
        chain-id: { type: string, format: uuid }
        amount: { type: string, format: decimal }
        currency: { type: string }
        status: { type: string, enum: [ APPROVED, REJECTED, IN_PROGRESS ] }
        transaction-date-time: { type: string, format: date-time }

paths:
  /cards/operations:
    get:
      operationId: GetCardOperations
      parameters:
        - name: card-id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: date-time-from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: date-time-to
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Card operations statement
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CardOperations'
