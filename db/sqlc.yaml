version: "2"
sql:
  - engine: "postgresql"
    queries: "query.sql"
    schema: "schema.sql"
    gen:
      go:
        package: "gen"
        out: "gen"
        sql_package: "pgx/v5"
        output_files_suffix: ".gen"
        output_models_file_name: "models.gen.go"
        output_db_file_name: "db.gen.go"